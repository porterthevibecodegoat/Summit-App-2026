<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Not Alone Summit Mobile Preview</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #ece7df;
        color: #1d2524;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        display: grid;
        gap: 16px;
        padding: 24px;
      }

      .phone {
        width: 393px;
        height: 852px;
        background: #111;
        border-radius: 48px;
        padding: 14px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.22);
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        border-radius: 36px;
        background: #f7f5f0;
      }

      .controls {
        font-size: 13px;
        line-height: 1.5;
        max-width: 393px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="phone" aria-label="Development-only iPhone safe-area preview">
        <iframe src="http://localhost:8081" title="Real Expo web mobile UI"></iframe>
      </div>
      <div class="controls">
        Development-only frame for the real Expo web app. Start it with <code>pnpm mobile:web</code>.
      </div>
    </main>
  </body>
</html>
