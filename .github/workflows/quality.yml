name: Quality Gates

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_PUBLIC_API_BASE_URL: https://summit-app-2026-admin.vercel.app
      APP_STORE_PRIVACY_URL: https://summit-app-2026-admin.vercel.app/privacy
      APP_SUPPORT_URL: https://summit-app-2026-admin.vercel.app/support
      EXPO_PUBLIC_ENABLE_DEMO_MODE: "false"
      EXPO_PUBLIC_ENABLE_PUSH_DELIVERY: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @not-alone/admin build
      - run: pnpm release:preflight -- --offline
